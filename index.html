<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0d0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://generativelanguage.googleapis.com">
<title>Inspi Tattoo</title>
<style>
  :root { --fond:#0f0d0c; --carte:#1b1816; --texte:#f1e9dc; --doux:#9d9183; --or:#c9a35b; --bord:#2e2925; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--fond); color:var(--texte); font-family:Georgia,"Times New Roman",serif;
         min-height:100vh; padding:env(safe-area-inset-top) 16px 90px; }
  header { display:flex; align-items:center; justify-content:space-between; padding:18px 0 6px; }
  h1 { font-size:1.5rem; font-weight:normal; letter-spacing:.08em; margin:0; color:var(--or); }
  .actions button { background:none; border:none; color:var(--doux); font-size:1.4rem; padding:8px; }
  .sous-titre { color:var(--doux); font-size:.95rem; margin:0 0 18px; }
  form { display:flex; gap:8px; }
  input[type=text], input[type=password] { flex:1; min-width:0; background:var(--carte); border:1px solid var(--bord);
         color:var(--texte); border-radius:12px; padding:14px; font-size:1.1rem; font-family:inherit; }
  input:focus { outline:none; border-color:var(--or); }
  button.principal { background:var(--or); color:#1a1508; border:none; border-radius:12px; padding:0 20px;
         font-size:1rem; font-weight:bold; font-family:inherit; min-width:104px; }
  button.principal:disabled { opacity:.6; }
  #statut { color:var(--doux); text-align:center; margin:16px 0 4px; min-height:1.4em; font-size:.95rem; }
  #statut.erreur { color:#e0806f; }
  ul { list-style:none; padding:0; margin:10px 0; display:grid; gap:8px; }
  li { background:var(--carte); border:1px solid var(--bord); border-radius:12px; padding:12px 14px;
       display:flex; justify-content:space-between; align-items:center; gap:10px; }
  li.entree { animation:monte .35s ease both; }
  li.choisi { border-color:var(--or); background:#26201a; }
  .mot { font-size:1.2rem; }
  .txt { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .lien { font-size:.8rem; color:var(--doux); font-style:italic; line-height:1.25; }
  .cat { font-size:.78rem; color:var(--or); border:1px solid var(--bord); border-radius:99px; padding:3px 10px; white-space:nowrap; }
  @keyframes monte { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

  /* chargement : cartes fantômes */
  li.sk { height:50px; border-color:transparent; background:linear-gradient(100deg,#1b1816 30%,#2a2420 50%,#1b1816 70%);
          background-size:200% 100%; animation:brille 1.2s linear infinite; }
  @keyframes brille { from { background-position:100% 0; } to { background-position:-100% 0; } }

  /* barre série */
  #resultats { display:none; scroll-margin-top:8px; }
  #pager { display:flex; align-items:center; gap:8px; margin-top:10px; }
  #pager button { background:var(--carte); border:1px solid var(--bord); color:var(--or); border-radius:10px;
                  width:44px; height:40px; font-size:1.1rem; }
  #pager button:disabled { opacity:.3; }
  #pager-txt { flex:1; text-align:center; color:var(--doux); font-size:.95rem; }
  #pager-txt b { color:var(--texte); font-weight:normal; font-size:1.05rem; }

  /* bouton Encore, toujours accessible en bas */
  #zone-encore { position:sticky; bottom:0; padding:14px 0 calc(14px + env(safe-area-inset-bottom));
                 background:linear-gradient(transparent, var(--fond) 35%); margin-top:6px; }
  #encore { width:100%; display:flex; align-items:center; justify-content:center; gap:10px; background:var(--or);
            color:#1a1508; border:none; border-radius:14px; padding:16px; font-size:1.05rem; font-weight:bold; font-family:inherit;
            box-shadow:0 6px 20px rgba(0,0,0,.5); transition:transform .1s; }
  #encore:active { transform:scale(.97); }
  #encore.charge { background:#3a3128; color:var(--or); }
  .spin { display:none; width:18px; height:18px; border:3px solid rgba(201,163,91,.3); border-top-color:var(--or);
          border-radius:50%; animation:tourne .8s linear infinite; }
  .charge .spin, button.principal.charge .spin { display:inline-block; }
  button.principal .spin { border-color:rgba(26,21,8,.3); border-top-color:#1a1508; width:14px; height:14px; border-width:2px; }
  button.principal { display:flex; align-items:center; justify-content:center; gap:8px; }
  @keyframes tourne { to { transform:rotate(360deg); } }

  /* panneaux */
  .panneau { display:none; background:var(--carte); border:1px solid var(--bord); border-radius:12px; padding:14px; margin-bottom:16px; }
  .panneau label { display:block; color:var(--doux); font-size:.9rem; margin-bottom:8px; }
  .panneau .ligne { display:flex; gap:8px; }
  .aide { color:var(--doux); font-size:.8rem; margin:10px 0 0; line-height:1.4; }
  .histo-tete { display:flex; justify-content:space-between; align-items:center; color:var(--or); margin-bottom:6px; }
  .histo-tete button { background:none; border:none; color:var(--doux); font-size:1.1rem; padding:4px 8px; }
  #histo-liste li { background:var(--fond); }
  #histo-liste .info { display:flex; flex-direction:column; gap:2px; }
  #histo-liste .sous { font-size:.78rem; color:var(--doux); }
  #histo-liste .suppr { background:none; border:none; color:var(--doux); font-size:1rem; padding:6px 8px; }
</style>
</head>
<body>
<header>
  <h1>INSPI TATTOO</h1>
  <div class="actions">
    <button id="btn-histo" aria-label="Historique">🕘</button>
    <button id="btn-reglages" aria-label="Réglages">⚙</button>
  </div>
</header>
<p class="sous-titre">Un mot, des idées de dessins venues de partout.</p>

<div id="reglages" class="panneau">
  <label for="cle">Clé Gemini gratuite (à saisir une seule fois, reste sur ce téléphone)</label>
  <div class="ligne">
    <input type="password" id="cle" placeholder="AIza..." autocomplete="off">
    <button class="principal" id="btn-cle" type="button" style="min-width:60px">OK</button>
  </div>
  <p class="aide">Gratuite : aistudio.google.com/apikey</p>
</div>

<div id="histo" class="panneau">
  <div class="histo-tete"><b>Recherches précédentes</b><button id="btn-histo-fermer" aria-label="Fermer">✕</button></div>
  <ul id="histo-liste"></ul>
</div>

<form id="form">
  <input type="text" id="mot" placeholder="force, courage, sagesse…" autocomplete="off" autocapitalize="none" enterkeyhint="search">
  <button class="principal" id="btn-go" type="submit"><span class="spin"></span><span id="go-txt">Chercher</span></button>
</form>

<div id="statut"></div>

<div id="resultats">
  <div id="pager">
    <button id="prec" aria-label="Série précédente">◀</button>
    <div id="pager-txt"></div>
    <button id="suiv" aria-label="Série suivante">▶</button>
  </div>
  <ul id="liste"></ul>
  <div id="zone-encore">
    <button id="encore"><span class="spin"></span><span id="encore-txt">Encore des idées</span></button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const URL_API = "https://generativelanguage.googleapis.com/v1beta/models/";
const MODELES = ["gemini-3.1-flash-lite", "gemini-2.5-flash", "gemini-2.5-flash-lite"];

let recherche = null;   // { id, mot, batches: [[{mot, categorie, choisi}]], index }
let enCours = false;

// ---------- Stockage ----------
function lire(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function ecrire(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lireHisto() { try { return JSON.parse(lire("historique") || "[]"); } catch (e) { return []; } }
function sauver() {
  if (!recherche || !recherche.batches.length) return;
  recherche.date = Date.now();
  let h = lireHisto().filter(x => x.id !== recherche.id);
  h.unshift(recherche);
  ecrire("historique", JSON.stringify(h.slice(0, 30)));
}

// ---------- Clé API ----------
function lireCle() { return lire("cle_api"); }
function ecrireCle(v) { ecrire("cle_api", v); }

function basculer(id) {
  const autres = ["reglages", "histo"].filter(x => x !== id);
  autres.forEach(x => $(x).style.display = "none");
  const p = $(id);
  p.style.display = p.style.display === "block" ? "none" : "block";
}
$("btn-reglages").onclick = () => basculer("reglages");
$("btn-histo").onclick = () => { afficherHisto(); basculer("histo"); };
$("btn-histo-fermer").onclick = () => $("histo").style.display = "none";
$("btn-cle").onclick = () => {
  const v = $("cle").value.trim();
  if (v) { ecrireCle(v); $("cle").value = ""; $("reglages").style.display = "none"; statut("Clé enregistrée ✔"); }
};

// Lien d'activation : https://.../#cle=XXXX enregistre la clé puis l'efface de l'adresse
try {
  const m = location.hash.match(/cle=([^&]+)/);
  if (m) { ecrireCle(decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname + location.search); statut("Clé enregistrée ✔"); }
} catch (e) {}
if (!lireCle()) $("reglages").style.display = "block";

// ---------- Appel IA (réponse en flux : les mots arrivent un par un) ----------
function construirePrompt(mot, exclus) {
  let p = `Une tatoueuse cherche l'inspiration pour dessiner le concept : « ${mot} ».
Méthode : repère d'abord les facettes du concept (son sens, ses émotions, ses symboles, son image culturelle, son contraire), puis propose 20 éléments concrets et dessinables (objets, animaux, plantes, lieux, symboles, phénomènes…) qui se rattachent à ces facettes.
Règles :
- RAPPORT OBLIGATOIRE : chaque élément a un lien réel avec une facette du concept, explicable en une courte phrase à un client. Un élément sans lien clair est interdit : remplace-le. Le lien peut être indirect ou symbolique, jamais inexistant.
- Dosage : 4 liens directs et évidents, 10 liens symboliques ou culturels, 6 liens plus lointains mais justifiables.
- Variété : au moins 14 catégories différentes (nature, mythologie, architecture, cuisine, marine, astronomie, métiers, sport, musique, histoire, sciences, objets du quotidien, outils, météo, jeux…).
- "lien" : pourquoi cet élément évoque le concept (4 à 9 mots). "mot" : 1 à 3 mots en français, sans doublon. "categorie" : 1 ou 2 mots.`;
  if (exclus.length) p += `\n- Ne répète pas : ${exclus.join(", ")}.`;
  p += `\nRéponds uniquement par un tableau JSON, clés dans cet ordre : [{"lien":"...","mot":"...","categorie":"..."}]`;
  return p;
}

function listeModeles() {
  const ok = lire("modele_ok");
  return ok && MODELES.includes(ok) ? [ok].concat(MODELES.filter(m => m !== ok)) : MODELES;
}

async function lireFlux(rep, onItem) {
  let texte = "", fait = 0;
  const re = /\{[^{}]*\}/g;
  const extraire = () => {
    re.lastIndex = 0;
    let m, n = 0;
    while ((m = re.exec(texte)) !== null) {
      n++;
      if (n > fait) {
        fait = n;
        try {
          const o = JSON.parse(m[0]);
          if (typeof o.mot === "string" && o.mot.trim())
            onItem({ mot: o.mot.trim(), categorie: String(o.categorie || "").trim(), lien: String(o.lien || "").trim() });
        } catch (e) {}
      }
    }
  };
  const ligne = l => {
    l = l.trim();
    if (!l.startsWith("data:")) return;
    try {
      const j = JSON.parse(l.slice(5));
      const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
      texte += parts.map(p => p.text || "").join("");
      extraire();
    } catch (e) {}
  };
  if (!rep.body || !rep.body.getReader) { (await rep.text()).split("\n").forEach(ligne); return; }
  const lecteur = rep.body.getReader(), dec = new TextDecoder();
  let tampon = "";
  while (true) {
    const { done, value } = await lecteur.read();
    if (done) break;
    tampon += dec.decode(value, { stream: true });
    const lignes = tampon.split("\n");
    tampon = lignes.pop();
    lignes.forEach(ligne);
  }
  if (tampon) ligne(tampon);
}

async function streamIdees(mot, exclus, onItem) {
  let derniere = 0;
  for (const modele of listeModeles()) {
    const gen = { temperature: 0.9, maxOutputTokens: 2200, responseMimeType: "application/json" };
    if (modele === "gemini-2.5-flash") gen.thinkingConfig = { thinkingBudget: 0 };
    const rep = await fetch(URL_API + modele + ":streamGenerateContent?alt=sse", {
      method: "POST",
      headers: { "content-type": "application/json", "x-goog-api-key": lireCle() },
      body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: construirePrompt(mot, exclus) }] }], generationConfig: gen })
    });
    if (!rep.ok) {
      const txt = await rep.text();
      if (/API key|API_KEY/i.test(txt)) throw new Error("Clé refusée. Vérifie-la dans ⚙.");
      derniere = rep.status;
      continue;
    }
    ecrire("modele_ok", modele);
    await lireFlux(rep, onItem);
    return;
  }
  if (derniere === 429) throw new Error("Limite gratuite atteinte pour le moment, réessaie dans une minute.");
  throw new Error("Service indisponible (" + derniere + ")");
}

// ---------- Affichage ----------
function statut(msg, erreur) { const s = $("statut"); s.textContent = msg || ""; s.className = erreur ? "erreur" : ""; }

function creerCarte(item) {
  const li = document.createElement("li");
  li.className = "entree" + (item.choisi ? " choisi" : "");
  const t = document.createElement("div"); t.className = "txt";
  const m = document.createElement("span"); m.className = "mot"; m.textContent = item.mot;
  t.appendChild(m);
  if (item.lien) { const l = document.createElement("span"); l.className = "lien"; l.textContent = item.lien; t.appendChild(l); }
  const c = document.createElement("span"); c.className = "cat"; c.textContent = item.categorie;
  li.append(t, c);
  li.onclick = () => { item.choisi = !item.choisi; li.classList.toggle("choisi", item.choisi); sauver(); };
  return li;
}

function ajouterCarte(item) {
  const liste = $("liste");
  const sks = liste.querySelectorAll(".sk");
  liste.insertBefore(creerCarte(item), sks[0] || null);
  if (sks.length) sks[sks.length - 1].remove();
}

function majPager() {
  const r = recherche, n = r ? r.batches.length : 0;
  $("pager-txt").innerHTML = "";
  if (!r) return;
  const b = document.createElement("b"); b.textContent = "« " + r.mot + " »";
  $("pager-txt").append(b, document.createTextNode(n > 1 ? "  ·  série " + (r.index + 1) + "/" + n : ""));
  $("prec").disabled = enCours || r.index <= 0;
  $("suiv").disabled = enCours || r.index >= n - 1;
}

function afficherSerie() {
  const liste = $("liste");
  liste.innerHTML = "";
  if (!recherche || !recherche.batches.length) { $("resultats").style.display = "none"; majPager(); return; }
  $("resultats").style.display = "block";
  recherche.batches[recherche.index].forEach(it => liste.appendChild(creerCarte(it)));
  majPager();
}

function etatChargement(charge) {
  enCours = charge;
  $("encore").classList.toggle("charge", charge);
  $("encore").disabled = charge;
  $("encore-txt").textContent = charge ? "Recherche en cours…" : "Encore des idées";
  $("btn-go").classList.toggle("charge", charge);
  $("btn-go").disabled = charge;
  $("go-txt").textContent = charge ? "Recherche" : "Chercher";
  majPager();
}

function messageErreur(e) {
  return (!navigator.onLine || e instanceof TypeError) ? "Pas de connexion internet." : e.message;
}

async function lancer(nouvelle) {
  if (enCours) return;
  const mot = nouvelle ? $("mot").value.trim() : (recherche && recherche.mot);
  if (!mot) return;
  if (!lireCle()) { $("reglages").style.display = "block"; statut("Ajoute d'abord ta clé dans ⚙", true); return; }
  if (navigator.vibrate) navigator.vibrate(15);

  const ancienne = recherche;
  const cible = nouvelle ? { id: Date.now(), mot, batches: [], index: -1 } : recherche;
  const exclus = [].concat(...cible.batches.map(b => b.map(i => i.mot)));
  const vus = new Set(exclus.map(x => x.toLowerCase()));
  const lot = [];
  cible.batches.push(lot);
  cible.index = cible.batches.length - 1;
  recherche = cible;
  $("histo").style.display = "none";

  // l'écran change tout de suite : anciens mots remplacés par des cartes de chargement
  $("resultats").style.display = "block";
  const liste = $("liste");
  liste.innerHTML = "";
  for (let i = 0; i < 8; i++) { const sk = document.createElement("li"); sk.className = "sk"; liste.appendChild(sk); }
  etatChargement(true);
  statut("Recherche d'idées…");
  $("resultats").scrollIntoView({ behavior: "smooth", block: "start" });

  try {
    await streamIdees(mot, exclus, item => {
      const cle = item.mot.toLowerCase();
      if (!item.mot || vus.has(cle)) return;
      vus.add(cle);
      item.choisi = false;
      lot.push(item);
      ajouterCarte(item);
    });
    if (!lot.length) throw new Error("Aucune idée trouvée, réessaie.");
    sauver();
    statut("Touche un mot pour le mettre de côté.");
  } catch (e) {
    if (!lot.length) {
      cible.batches.pop();
      cible.index = cible.batches.length - 1;
      if (!cible.batches.length) recherche = ancienne;
    } else { sauver(); }
    statut(messageErreur(e), true);
  } finally {
    liste.querySelectorAll(".sk").forEach(s => s.remove());
    etatChargement(false);
    if (!lot.length) afficherSerie();
  }
}

// ---------- Séries et historique ----------
function changerSerie(d) {
  if (enCours || !recherche) return;
  const i = recherche.index + d;
  if (i < 0 || i >= recherche.batches.length) return;
  recherche.index = i;
  afficherSerie();
  statut("");
}

function afficherHisto() {
  const ul = $("histo-liste");
  ul.innerHTML = "";
  const h = lireHisto();
  if (!h.length) { const li = document.createElement("li"); li.textContent = "Aucune recherche pour le moment."; ul.appendChild(li); return; }
  h.forEach(r => {
    const li = document.createElement("li");
    const info = document.createElement("div"); info.className = "info";
    const t = document.createElement("span"); t.className = "mot"; t.textContent = r.mot;
    const nb = r.batches.reduce((a, b) => a + b.length, 0);
    const s = document.createElement("span"); s.className = "sous";
    s.textContent = r.batches.length + " série" + (r.batches.length > 1 ? "s" : "") + " · " + nb + " idées · " +
      new Date(r.date || r.id).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
    info.append(t, s);
    const x = document.createElement("button"); x.className = "suppr"; x.textContent = "✕"; x.setAttribute("aria-label", "Supprimer");
    x.onclick = ev => { ev.stopPropagation(); ecrire("historique", JSON.stringify(lireHisto().filter(z => z.id !== r.id))); afficherHisto(); };
    li.append(info, x);
    li.onclick = () => {
      if (enCours) return;
      recherche = r; recherche.index = r.batches.length - 1;
      $("histo").style.display = "none";
      afficherSerie(); statut("");
      $("resultats").scrollIntoView({ behavior: "smooth", block: "start" });
    };
    ul.appendChild(li);
  });
}

$("form").onsubmit = e => { e.preventDefault(); $("mot").blur(); lancer(true); };
$("encore").onclick = () => lancer(false);
$("prec").onclick = () => changerSerie(-1);
$("suiv").onclick = () => changerSerie(1);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
